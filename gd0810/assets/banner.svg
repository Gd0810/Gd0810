<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Giridharan - Python Developer and AI Engineer">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b1a"/><stop offset="1" stop-color="#170b33"/></linearGradient>
<linearGradient id="ac" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
<radialGradient id="glow" cx=".75" cy=".5" r=".5"><stop offset="0" stop-color="#6366f1" stop-opacity=".35"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
</defs>
<style>
.ln{stroke:#818cf8;stroke-opacity:.35;stroke-width:1;stroke-dasharray:4 6;animation:flow 2.5s linear infinite}
.nd{fill:#22d3ee;animation:pulse 3s ease-in-out infinite}
.t{animation:rise 1.2s ease-out both}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.scan{animation:scan 6s linear infinite}
@keyframes scan{from{transform:translateY(-300px)}to{transform:translateY(300px)}}
</style>
<rect width="1200" height="300" rx="18" fill="url(#bg)"/>
